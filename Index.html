
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hatly Shipping Calculator</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #f1f4f9;
  font-family: Arial, sans-serif;
  color: #17243a;
}

.container {
  max-width: 520px;
  margin: auto;
}

.header {
  background: #17243a;
  color: white;
  padding: 25px;
  border-radius: 18px;
  margin-bottom: 18px;
}

.header h2 { margin: 0 0 8px; }
.header p { margin: 0; color: #cbd5e1; }

.card {
  background: white;
  padding: 20px;
  border-radius: 16px;
  margin-bottom: 16px;
  box-shadow: 0 3px 12px #00000008;
}

label {
  display: block;
  font-weight: bold;
  margin: 15px 0 8px;
}

input, select {
  width: 100%;
  padding: 13px;
  border: 1px solid #dce2eb;
  border-radius: 10px;
  font-size: 16px;
  background: white;
}

input:focus, select:focus {
  outline: 2px solid #506de0;
}

button {
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 10px;
  background: #263e69;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 15px;
}

.result {
  display: none;
}

.result-row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 13px 0;
  border-bottom: 1px solid #edf0f4;
}

.result-row span:last-child {
  font-weight: bold;
  text-align: left;
}

.total {
  background: #eaf0ff;
  padding: 16px;
  border-radius: 12px;
  margin-top: 15px;
}

.total strong {
  display: block;
  font-size: 24px;
  color: #263e69;
  margin-top: 8px;
}

.highlight {
  color: #16834b;
}

.note {
  color: #64748b;
  font-size: 13px;
  line-height: 1.7;
}

</style>
</head>

<body>
<div class="container">

  <div class="header">
    <h2>HATLY STORE</h2>
    <p>Shipping & Collection Calculator</p>
  </div>

  <div class="card">

    <label>سعر الجهاز (جنيه)</label>
    <input type="number" id="price" placeholder="مثال: 30000" min="0">

    <label>المحافظة</label>
    <select id="governorate">
      <option value="100">القاهرة</option>
      <option value="100">الجيزة</option>
      <option value="100">القليوبية</option>
      <option value="100">الإسكندرية</option>
      <option value="100">البحيرة</option>
      <option value="100">الغربية</option>
      <option value="100">المنوفية</option>
      <option value="100">الشرقية</option>
      <option value="100">الدقهلية</option>
      <option value="100">كفر الشيخ</option>
      <option value="100">دمياط</option>
      <option value="100">بورسعيد</option>
      <option value="100">الإسماعيلية</option>
      <option value="100">السويس</option>
      <option value="100">الفيوم</option>
      <option value="100">بني سويف</option>
      <option value="100">المنيا</option>
      <option value="200">أسيوط</option>
      <option value="200">سوهاج</option>
      <option value="200">قنا</option>
      <option value="200">الأقصر</option>
      <option value="200">أسوان</option>
      <option value="200">البحر الأحمر</option>
      <option value="200">الوادي الجديد</option>
      <option value="200">مطروح</option>
      <option value="200">شمال سيناء</option>
      <option value="200">جنوب سيناء</option>
    </select>

    <label>طريقة السداد</label>
    <select id="paymentType">
      <option value="partial">جزء مقدم + كاش عند الاستلام</option>
      <option value="full">تحويل قيمة الجهاز بالكامل مقدمًا</option>
    </select>

    <label>طريقة التحويل</label>
    <select id="transferType">
      <option value="instapay">Instapay</option>
      <option value="vodafone">Vodafone Cash</option>
    </select>

    <button onclick="calculate()">احسب المبلغ</button>
  </div>

  <div class="card result" id="result">

    <h3>تفاصيل الحساب</h3>

    <div class="result-row">
      <span>سعر الجهاز</span>
      <span id="devicePrice"></span>
    </div>

    <div class="result-row">
      <span>الشحن</span>
      <span id="shipping"></span>
    </div>

    <div class="result-row">
      <span>كاش عند الاستلام</span>
      <span id="cod"></span>
    </div>

    <div class="result-row">
      <span>رسوم التحصيل (1%)</span>
      <span id="collection"></span>
    </div>

    <div class="result-row">
      <span>المبلغ قبل عمولة التحويل</span>
      <span id="baseTransfer"></span>
    </div>

    <div class="result-row">
      <span>عمولة Vodafone Cash (1%)</span>
      <span id="vodafoneFee"></span>
    </div>

    <div class="total">
      <div>المبلغ المطلوب تحويله مقدمًا</div>
      <strong id="advance"></strong>
    </div>

    <div class="total">
      <div>المبلغ المطلوب كاش عند الاستلام</div>
      <strong id="cash" class="highlight"></strong>
    </div>

    <div class="total">
      <div>إجمالي ما سيدفعه العميل</div>
      <strong id="grandTotal"></strong>
    </div>

    <p class="note" id="explanation"></p>

    <button onclick="copyResult()">نسخ تفاصيل الأوردر</button>

  </div>

</div>

<script>

function money(value) {
  return Math.round(value).toLocaleString("en-US") + " جنيه";
}

let orderText = "";

function calculate() {

  const price = Number(document.getElementById("price").value);
  const shipping = Number(document.getElementById("governorate").value);

  const paymentType = document.getElementById("paymentType").value;
  const transferType = document.getElementById("transferType").value;

  if (!price || price <= 0) {
    alert("من فضلك أدخل سعر الجهاز");
    return;
  }

  const result = document.getElementById("result");
  result.style.display = "block";

  let cod = 0;
  let collection = 0;
  let baseTransfer = 0;
  let vodafoneFee = 0;
  let advance = 0;
  let explanation = "";

  if (paymentType === "partial") {

    // Maximum cash collection = 30,000
    cod = Math.min(price, 30000);

    // Collection fee = 1% of COD
    collection = cod * 0.01;

    // Remaining device value + shipping + collection fee
    baseTransfer = price - cod + shipping + collection;

    // Vodafone fee on actual transfer amount
    vodafoneFee = transferType === "vodafone"
      ? baseTransfer * 0.01
      : 0;

    advance = baseTransfer + vodafoneFee;

    explanation = "التحصيل عند الاستلام لا يتجاوز 30,000 جنيه.";

  } else {

    // Full payment in advance
    cod = 0;
    collection = 0;

    // Device price + shipping
    baseTransfer = price + shipping;

    // Vodafone fee on the full transferred amount
    vodafoneFee = transferType === "vodafone"
      ? baseTransfer * 0.01
      : 0;

    advance = baseTransfer + vodafoneFee;

    explanation = "تم تحويل قيمة الجهاز بالكامل مقدمًا، ولا توجد رسوم تحصيل عند الاستلام.";
  }

  document.getElementById("devicePrice").textContent = money(price);
  document.getElementById("shipping").textContent = money(shipping);
  document.getElementById("cod").textContent = money(cod);
  document.getElementById("collection").textContent = money(collection);
  document.getElementById("baseTransfer").textContent = money(baseTransfer);
  document.getElementById("vodafoneFee").textContent = money(vodafoneFee);
  document.getElementById("advance").textContent = money(advance);
  document.getElementById("cash").textContent = money(cod);

  document.getElementById("grandTotal").textContent =
    money(advance + cod);

  document.getElementById("explanation").textContent = explanation;

  const method = transferType === "instapay"
    ? "Instapay"
    : "Vodafone Cash";

  const mode = paymentType === "partial"
    ? "جزء مقدم + كاش عند الاستلام"
    : "تحويل كامل مقدمًا";

  orderText =
`HATLY STORE - تفاصيل الأوردر

سعر الجهاز: ${money(price)}
الشحن: ${money(shipping)}
طريقة السداد: ${mode}
طريقة التحويل: ${method}

المبلغ المحول مقدمًا: ${money(advance)}
الكاش عند الاستلام: ${money(cod)}

رسوم التحصيل: ${money(collection)}
عمولة التحويل: ${money(vodafoneFee)}

إجمالي الأوردر: ${money(advance + cod)}`;

}

function copyResult() {
  if (!orderText) return;

  navigator.clipboard.writeText(orderText)
    .then(() => alert("تم نسخ تفاصيل الأوردر"))
    .catch(() => alert("تعذر النسخ، حاول مرة أخرى"));
}

</script>

</body>
</html>
